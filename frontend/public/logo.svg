<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradArc" x1="40" y1="260" x2="340" y2="20">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <style>
      .title { font: 800 82px Arial; letter-spacing: 3px; fill: #F8FAFC; }
      .subtitle { font: 700 42px Arial; letter-spacing: 9px; fill: #E0F2FE; }
      .system { font: 700 34px Arial; letter-spacing: 12px; fill: #F1F5F9; }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(20,18)">
    <path d="M255 35 C185 0, 85 14, 34 91 C-12 160, 4 248, 67 302 C123 350, 218 356, 290 320"
          stroke="url(#gradArc)" stroke-width="16" fill="none" stroke-linecap="round"/>

    <!-- Calendar -->
    <rect x="110" y="80" width="150" height="120" rx="20" fill="#1E3A8A"/>
    <rect x="130" y="100" width="110" height="80" rx="10" fill="white"/>
  </g>

  <!-- Text -->
  <g transform="translate(380,72)">
    <text x="0" y="110" class="title">EVENT</text>
    <text x="0" y="176" class="subtitle">MANAGEMENT</text>

    <line x1="0" y1="218" x2="120" y2="218" stroke="#A78BFA" stroke-width="5"/>
    <text x="140" y="230" class="system">SYSTEM</text>
    <line x1="420" y1="218" x2="620" y2="218" stroke="#F472B6" stroke-width="5"/>
  </g>
</svg>
